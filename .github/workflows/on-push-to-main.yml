name: On push to main
on:
  push:
    branches: [main]

permissions:
  contents: write
  pull-requests: write

jobs:
  readme:
    runs-on: ubuntu-24.04
    steps:
      - name: Generate release bot token
        id: app-token
        uses: actions/create-github-app-token@v3
        with:
          app-id: ${{ secrets.MOMENTO_RELEASE_APP_ID }}
          private-key: ${{ secrets.MOMENTO_RELEASE_APP_PRIVATE_KEY }}

      - name: Setup repo
        uses: actions/checkout@v3
        with:
          token: ${{ steps.app-token.outputs.token }}

      - name: Generate README
        uses: momentohq/standards-and-practices/github-actions/generate-and-commit-oss-readme@gh-actions-v2
        with:
          project_status: official
          project_stability: stable
          project_type: sdk
          sdk_language: Go
          template_file: ./README.template.md
          output_file: ./README.md
          dev_docs_slug: go

      - name: Generate CONTRIBUTING
        uses: momentohq/standards-and-practices/github-actions/generate-and-commit-oss-readme@gh-actions-v2
        with:
          project_status: official
          project_stability: stable
          project_type: other
          sdk_language: Go
          template_file: ./CONTRIBUTING.template.md
          output_file: ./CONTRIBUTING.md
          dev_docs_slug: go

  test:
    runs-on: ubuntu-24.04
    needs: [readme]
    permissions:
      contents: read
      pull-requests: read
    env:
      MOMENTO_API_KEY: ${{ secrets.ALPHA_API_KEY_V2 }}
      MOMENTO_ENDPOINT: "cell-alpha-dev.preprod.a.momentohq.com"
      V1_API_KEY: ${{ secrets.ALPHA_TEST_AUTH_TOKEN }}
    steps:
      - name: Setup repo
        uses: actions/checkout@v3

      - name: Install Go
        uses: actions/setup-go@v3
        with:
          go-version: 1.27.x

      - name: Install devtools
        run: make install-devtools

      - name: Lint
        run: make lint

      - name: golangci-lint
        uses: golangci/golangci-lint-action@v8
        with:
          version: v2.13.2
          # goinstall builds with the runner's Go, so the linter can read
          # go1.27 export data regardless of what the release binary used.
          install-mode: goinstall
          only-new-issues: true

      # If there are any diffs from goimports or go mod tidy, fail.
      - name: Verify no changes from goimports and go mod tidy
        run: |
          if [ -n "$(git status --porcelain)" ]; then
            git diff
            exit 1
          fi

      - name: Build
        run: make build

      - name: Build examples
        run: make build-examples

      - name: Run test
        run: make prod-test

  release-please:
    runs-on: ubuntu-latest
    needs: [test]
    name: Release Please
    steps:
      - name: Generate release bot token
        id: app-token
        uses: actions/create-github-app-token@v3
        with:
          app-id: ${{ secrets.MOMENTO_RELEASE_APP_ID }}
          private-key: ${{ secrets.MOMENTO_RELEASE_APP_PRIVATE_KEY }}

      - uses: google-github-actions/release-please-action@v3
        id: release
        with:
          token: ${{ steps.app-token.outputs.token }}
          release-type: go
          package-name: momento
          default-branch: main
          changelog-types: '[{"type":"feat","section":"Features","hidden":false},{"type":"fix","section":"Bug Fixes","hidden":false},{"type":"chore","section":"Miscellaneous","hidden":false}]'
          extra-files: |
            internal/metadata.go
